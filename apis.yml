aid: figs
name: FIGS
description: 'FIGS, Inc. (NYSE: FIGS) is a founder-led, direct-to-consumer healthcare
  apparel and lifestyle brand founded in 2013 by Heather Hasson and Trina Spear and
  headquartered in Santa Monica, California. FIGS designs and sells premium scrubwear
  and non-scrubwear offerings — lab coats, underscrubs, outerwear, footwear, compression
  socks, loungewear, and accessories — directly to healthcare professionals through
  its Shopify-based online store at wearfigs.com. FIGS is a consumer e-commerce and
  retail brand with a customer help center and investor-relations presence; it publishes
  no public developer API, SDKs, or developer portal.'
